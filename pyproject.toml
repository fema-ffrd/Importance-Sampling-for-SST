[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-importance-sampling"
version = "0.2.0"
description = "Importance Sampling for Storm Transposition (SST)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shubham Jain", email = "shubham.jain@mbakerintl.com"}
]
keywords = ["storm", "hydrology", "transposition", "sampling", "importance-sampling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "pandas>=1.3",
    "geopandas>=0.10",
    "xarray>=0.20",
    "rasterio>=1.2",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.6",
    "pyarrow>=10.0",
    "jsonschema>=4.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=0.990",
    "isort>=5.11",
    "jupyter>=1.0",
    "jupyterlab>=3.0",
]

docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.1",
    "sphinx-autodoc-typehints>=1.19",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["SSTImportanceSampling"]

[tool.setuptools.package-data]
SSTImportanceSampling = ["py.typed", "schema.json"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
minversion = "7.0"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true