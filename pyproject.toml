[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-importance-sampling"
version = "0.2.0"
description = "Importance Sampling for Storm Transposition (SST)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shubham Jain", email = "shubham.jain@mbakerintl.com"}
]
keywords = ["storm", "hydrology", "transposition", "sampling", "importance-sampling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "pandas>=1.3",
    "geopandas>=0.10",
    "xarray>=0.20",
    "rasterio>=1.2",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.6",
    "pyarrow>=10.0",
    "jsonschema>=4.0",
    "matplotlib>=3.5",
    "ulid-py>=1.1.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=0.990",
    "isort>=5.11",
    "jupyter>=1.0",
    "jupyterlab>=3.0",
]

docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.1",
    "sphinx-autodoc-typehints>=1.19",
]

[project.urls]
Homepage = "https://github.com/fema-ffrd/Importance-Sampling-for-SST"
Documentation = "https://github.com/fema-ffrd/Importance-Sampling-for-SST"
Repository = "https://github.com/fema-ffrd/Importance-Sampling-for-SST.git"
Issues = "https://github.com/fema-ffrd/Importance-Sampling-for-SST/issues"

[project.scripts]
sst-importance-sampling = "run:main"
sst-preprocess = "run:run_preprocessing"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["SSTImportanceSampling"]

[tool.setuptools.package-data]
SSTImportanceSampling = ["py.typed", "schema.json"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled by black

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing -v"
minversion = "7.0"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/SSTImportanceSampling"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]