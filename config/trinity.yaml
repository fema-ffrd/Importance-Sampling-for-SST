# ============================================================
# SST Importance Sampling Configuration
# ============================================================

project:
  name: "trinity"
  run_type: "sst-ais"

# ============================================================
# GLOBAL SETTINGS
# ============================================================
global:
  random_seed: 5131

# ============================================================
# INPUT DATA PATHS
# ============================================================
paths:
  watershed_geojson: "../data/0_source/trinity/trinity.geojson"
  domain_geojson: "../data/0_source/trinity/trinity-transpo-area-v01.geojson"
  dss_catalog: "../data/0_source/trinity/dss_files"

# ============================================================
# OUTPUT SETTINGS
# ============================================================
output:
  base_folder: "../data/1_interim/trinity"
  export_format: "parquet"     # csv or parquet for tabular data

# ============================================================
# PREPROCESSING SETTINGS
# ============================================================
preprocess:
  mode: "auto"
  existing_run: null
  grid_spacing: 1000
  dss_variable_keyword: "PRECIPITATION"
  dss_grid_keyword: "SHG"
  dss_max_workers: 16

  validity:
    enabled: true
    max_workers: 16
    fishnet_chunk_size: 100000

  netcdf_compression:
    zlib: true
    complevel: 4

# ============================================================
# SAMPLING SETTINGS
# ============================================================
sampling:
  method: "uniform"
  n_events: 100