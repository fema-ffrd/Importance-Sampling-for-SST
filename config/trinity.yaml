# ============================================================
# SST Importance Sampling Configuration
# ============================================================
project:
  name: "trinity"
  run_type: "sst_ais"

# ============================================================
# INPUT DATA PATHS
# ============================================================
paths:
  watershed_geojson: "../data/0_source/trinity/trinity.geojson"
  domain_geojson: "../data/0_source/trinity/trinity-transpo-area-v01.geojson"
  dss_catalog: "../data/0_source/trinity/dss_files"

# ============================================================
# OUTPUT SETTINGS
# ============================================================
output:
  base_folder: "../data/1_interim/trinity"
  export_format: "csv"

# ============================================================
# PREPROCESSING SETTINGS
# ============================================================
preprocess:
  mode: "auto"
  existing_run: "../data/1_interim/trinity/trinity_sst_ais_20260428_162432_seed3468"
  grid_spacing: 1000
  dss_variable_keyword: "PRECIPITATION"
  dss_grid_keyword: "SHG"
  random_seed: null
  
  dss_max_workers: 16

  validity:
    enabled: true
    export_format: "csv"
    max_workers: 16
    fishnet_chunk_size: 100000

  netcdf_compression:
    zlib: true
    complevel: 4

# ============================================================
# SAMPLING SETTINGS
# ============================================================
sampling:
  # Sampling method: "uniform"
  method: "uniform"
  
  # Number of events to sample
  n_events: 100
  
  # Export format: "csv" or "parquet"
  export_format: "csv"