# ============================================================
# SST Importance Sampling Configuration
# Project: Trinity
# ============================================================

# ------------------------------------------------------------
# PROJECT METADATA
# ------------------------------------------------------------
project:
  # Unique project identifier (used in run folder naming)
  name: "trinity"

  # Run type (used to differentiate folder naming for sampling strategies)
  run_type: "sst_ais"

# ------------------------------------------------------------
# INPUT DATA PATHS
# All relative paths are resolved relative to THIS config file
# ------------------------------------------------------------
paths:

  # Watershed boundary (GeoJSON)
  watershed_geojson: "../data/0_source/trinity/trinity.geojson"

  # Transposition domain boundary (GeoJSON)
  domain_geojson: "../data/0_source/trinity/trinity-transpo-area-v01.geojson"

  # Directory containing DSS files OR a STAC catalog JSON
  dss_catalog: "../data/0_source/trinity/dss_files"

# ------------------------------------------------------------
# OUTPUT SETTINGS
# ------------------------------------------------------------
output:

  # Base directory where all runs will be created
  # Each execution creates:
  #   <project_name>_<timestamp>_seedXXXX/
  base_folder: "../data/1_interim/trinity"

  # Export format for all output tables
  # Options: "csv" or "parquet"
  # - csv: human-readable, larger file size
  # - parquet: compressed, faster I/O, recommended for large datasets
  export_format: "csv"

# ------------------------------------------------------------
# PREPROCESSING SETTINGS
# ------------------------------------------------------------
preprocess:

  # Mode options:
  #   "force"  → always recompute preprocessing
  #   "reuse"  → require existing_run
  #   "auto"   → reuse if existing_run provided, otherwise compute
  mode: "auto"

  # Optional: specify an existing run folder (relative or absolute path)
  # Example:
  #   existing_run: "./data/1_interim/trinity/trinity_sst_ais_20240415_101200_seed1234"
  existing_run: null

  # Fishnet grid spacing (units = projected CRS units)
  # e.g., 1000 = 1km spacing if CRS is in meters
  grid_spacing: 1000

  # DSS filtering options
  # Only records containing these keywords will be used
  dss_variable_keyword: "PRECIPITATION"
  dss_grid_keyword: "SHG"

  # Random seed for reproducibility
  # If null → automatically generated
  random_seed: null

  # ----------------------------------------------------------
  # VALIDITY CHECKING (Storm Transposition)
  # ----------------------------------------------------------
  validity:

    # Enable validity checking of storm placements
    enabled: true

    # Export format for validity results
    # Options: "csv" or "parquet"
    # Defaults to output.export_format if not specified
    export_format: "csv"

    # Number of parallel workers for validity computation
    # Recommended: use number of CPU cores / 2
    # Example: 4-8 for typical machines, 16-32 for high-end servers
    max_workers: 4

    # Fishnet chunk size for memory efficiency
    # Process fishnet grid in chunks of this size
    # - Smaller values: lower memory usage, slower
    # - Larger values: higher memory usage, faster
    # Recommended: 5000-20000 depending on available RAM
    fishnet_chunk_size: 10000

  # ----------------------------------------------------------
  # NetCDF Output Compression
  # ----------------------------------------------------------
  netcdf_compression:

    # Enable NetCDF compression
    zlib: true

    # Compression level (1 = fast, 9 = max compression)
    complevel: 4